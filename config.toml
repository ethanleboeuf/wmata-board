# wmata-board configuration. Edit and restart:
#   systemctl --user restart wmata-board
# The API key is NOT here: it comes from WMATA_API_KEY in the environment
# (~/wmata-board.env on the Pi) or a gitignored .env next to this file.

[board]
stations = ["K01"]
lines = ["OR", "SV"]          # omit to use every line the station serves
rows_per_direction = 3
timezone = "America/New_York"

[stations.K01.platforms]      # WMATA "Group" -> label; K01: 1 = eastbound, 2 = westbound
1 = "To Washington · New Carrollton"
2 = "To Vienna · Ashburn"

[polling]                      # seconds
arrivals = 20
incidents = 60
positions = 5
trips = 20                     # live trip predictions, only while a commute panel is up
idle_after = 90                # a feed is polled only this long after someone last asked

[map]
bbox = [-77.122, 38.844, -76.978, 38.966]   # west, south, east, north
labels = ["K04", "K02", "C05", "C04", "C01", "D03", "B03", "A03", "C07", "F05", "B05"]
places = [["GEORGETOWN", 38.9085, -77.0665], ["THE MALL", 38.8873, -77.0405], ["ARLINGTON", 38.8705, -77.106], ["WASHINGTON", 38.9335, -77.096]]

[[map.landmarks]]
name = "Children's National"
lat = 38.92711
lon = -77.01417
style = "hospital"

[server]
host = "127.0.0.1"
port = 8766

[commute]                     # Children's National via the Brookland shuttle (weekdays only)
name = "Children's National"
home = "K01"                  # Court House
transfer = ["C01", "A01"]     # Metro Center: Orange/Silver platform, Red platform
shuttle_stop = "B05"          # Brookland-CUA
evening_from = "B07"          # Takoma, the other evening start
morning = ["06:30", "08:10"]  # wall + phone: Court House -> shuttle
evening = ["16:00", "18:30"]  # phone: hospital or Takoma -> Court House
shuttles = ["08:12", "08:18"] # the morning shuttles she aims for (highlighted)
shuttle_every = 6             # minutes; it leaves both ends on :00, :06, :12 ...
shuttle_ride = 12             # hospital -> Brookland stop; + shuttle_walk = 15 door to platform
transfer_walk = 2             # Metro Center, platform to platform, minutes
shuttle_walk = 3              # Brookland, platform <-> shuttle stop, minutes
rows = 5
lines = ["OR", "SV", "RD"]    # alerts for these lines show while the panel is up
wall_platform = "2"           # the wall's westbound list gives way to the panel
